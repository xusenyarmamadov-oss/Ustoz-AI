
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video montaj | Ustoz AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #eef4ff;
            --tx: #0d1b3d;
            --card: rgba(255,255,255,.85);
        }

        [data-t="dark"] {
            --bg: #0b1220;
            --tx: #eef4ff;
            --card: #172338;
        }

        body {
            margin: 0;
            padding: 30px 16px;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--tx);
            transition: .3s;
        }

        .container {
            max-width: 1050px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #1f6bff;
        }

        .intro {
            text-align: center;
            margin-bottom: 35px;
            color: #5b6b8c;
        }

        .video {
            background: var(--card);
            color: var(--tx);
            padding: 14px;
            border-radius: 18px;
            margin-bottom: 24px;
            box-shadow: 0 5px 20px #00000010;
            animation: show .6s ease both;
        }

        iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: 0;
            border-radius: 12px;
        }

        h3 {
            margin: 12px 0 4px;
        }

        .back {
            display: block;
            width: fit-content;
            margin: 0 0 25px;
            padding: 12px 22px;
            background: linear-gradient(135deg, #1f6bff, #00b4ff);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            transition: .3s;
            box-shadow: 0 5px 15px #1f6bff30;
        }

        .back:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px #1f6bff45;
        }

        @keyframes show {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

<div class="container">

    <a href="index.html" class="back">← Bosh sahifaga qaytish</a>

    <h1>🎬 Video montaj</h1>

    <p class="intro">
        Video montaj qilishni videodarslar orqali o'rganing!
    </p>

    <div class="video">
        <iframe src="https://www.youtube.com/embed/-zS2oRmRZCg"
        allowfullscreen></iframe>
        <h3>🎬 1-dars</h3>
    </div>

    <div class="video">
        <iframe src="https://www.youtube.com/embed/BuOEKOh_XyM"
        allowfullscreen></iframe>
        <h3>🎬 2-dars</h3>
    </div>

    <div class="video">
        <iframe src="https://www.youtube.com/embed/YxXkMyd_D5U"
        allowfullscreen></iframe>
        <h3>🎬 3-dars</h3>
    </div>

    <div class="video">
        <iframe src="https://www.youtube.com/embed/m0xL3Yx2s-g"
        allowfullscreen></iframe>
        <h3>🎬 4-dars</h3>
    </div>

</div>

<script>
const theme = localStorage.getItem("theme");

if (theme) {
    document.documentElement.dataset.t = JSON.parse(theme);
}
</script>

</body>
</html>
